<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Venda - Mundo Maromba Fit</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .editar-container {
            max-width: 700px;
            margin: 50px auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
        }
        .editar-container h1 { color: #F5A623; margin-bottom: 10px; }
        .venda-info { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #F5A623; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border-radius: 8px; border: none;
            background: rgba(255,255,255,0.1); color: #fff; font-size: 16px;
        }
        .form-group input[readonly] { background: rgba(255,255,255,0.05); color: #aaa; }
        .btn-salvar { background: #4caf50; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; margin-right: 10px; }
        .btn-voltar { background: #666; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; }
        .btn-cancelar-venda { background: #f44336; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; }
        .message { margin-top: 20px; padding: 10px; border-radius: 8px; text-align: center; }
        .message.sucesso { background: rgba(76, 175, 80, 0.3); border: 1px solid #4caf50; }
        .message.erro { background: rgba(244, 67, 54, 0.3); border: 1px solid #f44336; }
        .detalhes-venda { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .warning { color: #ff9800; font-size: 14px; }
        .btn-excluir { background: #f44336; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="editar-container">
            <h1>✏️ Editar Venda</h1>
            <div id="vendaTitulo" class="venda-info">Carregando...</div>

            <form id="editarVendaForm">
                <div class="detalhes-venda"><strong>📋 Informações da Venda</strong></div>

                <div class="form-group">
                    <label>Produto:</label>
                    <input type="text" id="produto" readonly>
                </div>

                <div class="form-group">
                    <label>Quantidade:</label>
                    <input type="number" id="quantidade" readonly>
                </div>

                <div class="form-group">
                    <label>Cliente:</label>
                    <input type="text" id="cliente" readonly>
                </div>

                <div class="form-group">
                    <label>Valor total (R$):</label>
                    <input type="number" id="valorTotal" step="0.01" readonly>
                </div>

                <div class="detalhes-venda"><strong>💳 Alterar Pagamento</strong></div>

                <div class="form-group">
                    <label>Forma de pagamento:</label>
                    <select id="pagamento" required>
                        <option value="Pix">Pix</option>
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Débito">Débito</option>
                        <option value="Crédito">Crédito</option>
                    </select>
                </div>

                <div class="form-group" id="parcelasGroup" style="display:none;">
                    <label>Número de parcelas:</label>
                    <select id="parcelas">
                        <option value="1">1x</option>
                        <option value="2">2x</option>
                        <option value="3">3x</option>
                        <option value="4">4x</option>
                        <option value="5">5x</option>
                        <option value="6">6x</option>
                        <option value="7">7x</option>
                        <option value="8">8x</option>
                        <option value="9">9x</option>
                        <option value="10">10x</option>
                        <option value="11">11x</option>
                        <option value="12">12x</option>
                        <option value="13">13x</option>
                        <option value="14">14x</option>
                        <option value="15">15x</option>
                        <option value="16">16x</option>
                        <option value="17">17x</option>
                        <option value="18">18x</option>
                    </select>
                </div>

                <div style="margin-top:30px;">
                    <button type="submit" class="btn-salvar">💾 Salvar Alterações</button>
                    <button type="button" id="voltarBtn" class="btn-voltar">← Voltar</button>
                </div>
            </form>

            <div style="margin-top:30px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.2);">
                <button type="button" id="cancelarVendaBtn" class="btn-cancelar-venda">❌ Cancelar Venda (devolve ao estoque)</button>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="editar-venda.js"></script>
</body>
</html>
